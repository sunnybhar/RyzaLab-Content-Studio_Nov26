n{display:block;font-size:12px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid #9cb1b6;background:white;margin:22px 0}.week>div{padding:12px;min-height:280px;border-right:1px solid #ced9db}.calendar-post{padding:10px;text-align:left;background:#e1f1ed;width:100%;font-size:12px;line-height:1.7;border-left:4px solid #086b61}.ai-row{display:grid;grid-template-columns:1fr 1.6fr auto;gap:20px;align-items:center;padding:15px 18px;border-bottom:1px solid #ccd8da}.activity-row{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid #d2dddf}progress{width:100%;height:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}dialog{width:min(1050px,calc(100vw - 40px));max-height:90vh;border:1px solid #6f929a;padding:0;border-radius:12px;background:#fff;color:#162f36}dialog::backdrop{background:#0b2029ad}.modal-head{position:sticky;top:0;background:#f0f5f5;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-bottom:1px solid #bcced1}.modal-head h3{margin:0}.modal-body{padding:22px 28px}.modal-body h2{margin-top:0}.post-copy{white-space:pre-wrap;line-height:1.8}.badge{font-size:12px;color:#bbded7}.screen-note{font-size:12px;border-top:1px solid #bacbce;padding-top:13px;margin-top:25px;color:#47636b}[hidden]{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}nav{display:none}main{padding:18px}.flow{grid-template-columns:repeat(2,1fr)}.metrics,.tiles,.split{grid-template-columns:1fr}.tr{grid-template-columns:1.5fr 1fr}.week{overflow:auto;grid-template-columns:repeat(7,140px)}.ai-row{grid-template-columns:1fr}.prototype-bar{display:block}.prototype-nav button{font-size:11px}.form-grid{grid-template-columns:1fr}}@media print{.prototype-bar,.prototype-nav,nav{display:none}.layout{display:block}main{padding:15px}.screen-note{display:none}}</style><body><div class="prototype-bar"><b>RYZALAB · SOLO FOUNDER WIREFRAMES</b><span>Design review only · Sample data · No AI calls, saving or publishing</span></div><div class="prototype-nav"><button class="" data-go="home">1. Overview</button><button class="" data-go="ideas">2. Ideas</button><button class="" data-go="create">3. Create copy</button><button class="" data-go="package">4. Final review</button><button class="" data-go="calendar">5. Calendar</button><button class="" data-go="ai">6. AI setup</button><button class="" data-go="activity">7. Activity</button><button class="" data-go="workflow">8. Channel setup</button></div><div class="layout"><nav><strong>RyzaLab</strong><button class="" data-go="home">Overview</button><button class="" data-go="ideas">Ideas</button><button class="" data-go="create">Create copy</button><button class="" data-go="package">Final review</button><button class="" data-go="calendar">Calendar</button><button class="" data-go="ai">AI setup</button><button class="" data-go="workflow">Channel setup</button><hr><small>Background work is visible inside each draft.<br>Activity is an advanced view.</small></nav><main id="screen"></main></div><dialog id="modal"><div class="modal-head"><h3>Wireframe detail</h3><button data-close aria-label="Close wireframe dialog">Close ×</button></div><div id="modal-body" class="modal-body"></div></dialog><script>const views={"home": {"title": "RyzaLab Studio \u00b7 Human by design", "sub": "You create. Your team reviews. A person always hits publish.", "html": "<div class=\"flow\"><div><b>1</b><strong>Choose idea</strong><small>Human chooses direction</small></div><div><b>2</b><strong>Create copy</strong><small>Agent drafts and checks</small></div><div><b>3</b><strong>Approve copy</strong><small>Human review 1</small></div><div><b>4</b><strong>Prepare package</strong><small>Agent makes assets + checks</small></div><div><b>5</b><strong>Approve & plan</strong><small>Human review 2 + date</small></div><div><b>6</b><strong>Publish manually</strong><small>Human posts; Studio records</small></div></div><div class=\"metrics\"><div class=\"box \"><h3>1 copy ready</h3><p>LinkedIn \u00b7 Household handoff</p><button class=\"primary\" data-go=\"create\">Review copy</button></div><div class=\"box \"><h3>1 package ready</h3><p>Instagram \u00b7 Routine checklist</p><button class=\"primary\" data-go=\"package\">Review package</button></div><div class=\"box \"><h3>2 upcoming posts</h3><p>See when, where and what.</p><button class=\"\" data-go=\"calendar\">Open calendar</button></div></div><div class=\"box \"><h3>Needs your input, not another checklist</h3><span class=\"pill warn\">Needs a source</span><p>One claim needs a reference. The agent flags the exact sentence and proposes a correction.</p><button class=\"\" data-go=\"create\">Resolve in editor</button></div>"}, "ideas": {"title": "Ideas", "sub": "Choose the direction. The agent carries it into creation.", "html": "<div class=\"toolbar\"><div class=\"tabs\"><button class=\"selected\" data-tab>LinkedIn</button><button class=\"\" data-tab>Instagram</button><button class=\"\" data-tab>TikTok</button><button class=\"\" data-tab>Facebook</button><button class=\"\" data-tab>YouTube</button><button class=\"\" data-tab>Reddit</button><button class=\"\" data-tab>Notes</button><button class=\"\" data-tab>Newsletter</button><button class=\"\" data-tab>Hub</button></div><div><button class=\"primary\" data-modal=\"ideaGenerate\">Generate ideas</button> <button class=\"\" data-modal=\"idea\">Add idea</button></div></div><div class=\"toolbar\"><input placeholder=\"Search ideas\" aria-label=\"Search ideas\"><div><button class=\"\" data-idea-layout=\"list\" class=\"selected\">List</button> <button class=\"\" data-idea-layout=\"tiles\">Tiles</button></div></div><div id=\"idea-list\"><div class=\"table\"><div class=\"tr th\"><span>Idea / title</span><span>Platform</span><span>Status</span><span>Created</span><span>Publication</span></div><button class=\"tr idea-row\" data-modal=\"idea\"><strong>A handoff someone else can follow</strong><span>LinkedIn</span><span>Ready to choose</span><span>Oct 29</span><span>Not published</span></button><button class=\"tr idea-row\" data-modal=\"idea\"><strong>Write the routine before automating it</strong><span>Instagram</span><span>In creation</span><span>Oct 28</span><span>Not published</span></button><button class=\"tr idea-row\" data-modal=\"idea\"><strong>Three questions for a better handoff</strong><span>Newsletter</span><span>Published</span><span>Oct 22</span><span>Oct 27 \u2014 human confirmed</span></button></div></div><div id=\"idea-tiles\" hidden><div class=\"tiles\"><div class=\"box \"><h3>A handoff someone else can follow</h3><p>LinkedIn \u00b7 <span class=\"pill \">Ready to choose</span></p><p>Created Oct 29 \u00b7 Not published</p><button class=\"\" data-modal=\"idea\">Open idea</button></div><div class=\"box \"><h3>Write the routine before automating it</h3><p>Instagram \u00b7 <span class=\"pill \">In creation</span></p><p>Created Oct 28 \u00b7 Not published</p><button class=\"\" data-modal=\"idea\">Open idea</button></div><div class=\"box \"><h3>Three questions for a better handoff</h3><p>Newsletter \u00b7 <span class=\"pill \">Published</span></p><p>Created Oct 22 \u00b7 Oct 27 \u2014 human confirmed</p><button class=\"\" data-modal=\"idea\">Open idea</button></div></div></div><p class=\"muted\">Descriptions stay collapsed. Click an idea to see its complete brief, sources, status and linked content.</p>"}, "create": {"title": "Create \u00b7 Household handoff", "sub": "Selected idea, brand instructions and sources are already attached.", "html": "<div class=\"toolbar\"><strong>Destination: LinkedIn \u00b7 RyzaLab company page</strong><button class=\"\" data-modal=\"destination\">Change destination before approval</button></div><div class=\"steps\"><span class=\"selected\">1 \u00b7 Copy</span><span>2 \u00b7 Assets & checks</span><span>3 \u00b7 Final review</span></div><div class=\"split\"><div><div class=\"box \"><h3>LinkedIn \u00b7 Text post</h3><div class=\"toolbar\"><span class=\"pill good\">Draft ready</span><span>Saved automatically \u00b7 revision retained</span></div><textarea aria-label=\"Draft copy\" rows=\"10\">A useful home handoff should answer two questions: who can do what, and what happens when something stops working?\n\nWrite down who needs access, where the instructions are stored, what works manually, and who to contact.\n\nWalk through the routine with the person who will use it. Their questions reveal what you may have taken for granted.</textarea><div class=\"toolbar\"><button class=\"\" data-modal=\"feedback\">Improve selected text</button><button class=\"\" data-modal=\"feedback\">Regenerate copy</button></div></div><details class=\"box\"><summary>Idea brief and references \u00b7 3 attached</summary><p>Selected idea, reviewed channel rules and supporting brand references. No copy/paste from an activity log.</p></details></div><aside><div class=\"box \"><h3>Agent preparation</h3><span class=\"pill neutral\">Illustrative check report</span><p>\u2713 Tone and format checked</p><p>\u2713 Placeholder scan complete</p><p>\u2713 No statistical claims found</p><details><summary>Evidence and detailed findings</summary><p>Checks describe what was tested. Missing sources stay flagged; agent opinion is not fact verification.</p></details></div><details class=\"box\"><summary>Creative direction \u00b7 collapsed</summary><p>Applied automatically from LinkedIn workflow. Edit setup only if your policy changes.</p></details><div class=\"box \"><h3>Your first review</h3><p>Read and edit the copy. Accept it before media work begins. Preparation runs only within the founder-authorized package budget; otherwise one cost confirmation is required.</p><button class=\"primary\" data-go=\"package\">Approve copy</button> <button class=\"\" data-modal=\"feedback\">Request changes</button></div></aside></div><div class=\"status\">Agent activity appears here: preparing copy \u2192 checking \u2192 ready / needs your input. No separate queue visit.</div>"}, "package": {"title": "Review the complete package", "sub": "Second human review: inspect the exact copy and every asset together.", "html": "<div class=\"toolbar\"><strong>Approving for LinkedIn \u00b7 RyzaLab company page</strong><span class=\"pill good\">Copy approved \u00b7 media revision 2</span><button class=\"\" data-modal=\"package\">Open as review popup</button></div><div class=\"split\"><div><div class=\"tabs\"><button class=\"selected\" data-tab>Post preview</button><button class=\"\" data-tab>Copy</button><button class=\"\" data-tab>Carousel</button><button class=\"\" data-tab>Video</button></div><div class=\"social-preview\"><div class=\"avatar\">R</div><strong>RyzaLab \u00b7 LinkedIn preview</strong><p>A useful home handoff should answer two questions: who can do what, and what happens when something stops working?<br><br>Write down who needs access, where the instructions are stored, what works manually, and who to contact.<br><br>Walk through the routine with the person who will use it. Their questions reveal what you may have taken for granted.</p><div class=\"visual\"><b>APPROVED COPY + FINAL VISUAL</b><span>Illustrative asset preview</span></div></div></div><aside><div class=\"box \"><h3>Agent quality report</h3><p>\u2713 Text and asset versions match</p><p>\u2713 Caption and crop checks complete</p><p>\u2713 Required disclosures checked</p><details><summary>Show findings, sources and reviewer identity</summary><p>Actual check results and provenance would be retained. Required independent review uses its configured reviewer.</p></details></div><div class=\"box \"><h3>One decision for this package</h3><p>Accept all included assets, request targeted changes, or hold. Copy changes return to copy approval. Unchanged assets remain available; only affected dependencies are rechecked.</p><button class=\"primary\" data-modal=\"schedule\">Approve package & choose date</button> <button class=\"\" data-modal=\"feedback\">Request changes</button></div><div class=\"box \"><h3>Notes release rule</h3><p>For Notes, the same screen includes explicit founder release authorization. Human approval cannot waive factual or misrepresentation blocks.</p></div></aside></div>"}, "calendar": {"title": "Content calendar", "sub": "One view of the day, platform, account and exact approved package.", "html": "<div class=\"toolbar\"><div><button class=\"\" >\u2039</button> <strong>November 2\u20138 \u00b7 2026</strong> <button class=\"\" >\u203a</button></div><div class=\"tabs\"><button class=\"selected\" data-tab>Week</button><button class=\"\" data-tab>Month</button><button class=\"\" data-tab>Agenda</button></div><button class=\"primary\" data-modal=\"schedule\">Plan approved content</button></div><p class=\"muted\">All times: America/New_York \u00b7 Planned dates do not mean a post is live.</p><div class=\"week\"><div><h4>Mon 2</h4><button class=\"calendar-post\" data-modal=\"preview\">09:30 \u00b7 LinkedIn<br><b>Household handoff</b><br>Planned \u00b7 Company page</button></div><div><h4>Tue 3</h4><span class=\"muted\">No post planned</span></div><div><h4>Wed 4</h4><button class=\"calendar-post\" data-modal=\"preview\">11:00 \u00b7 Instagram<br><b>Routine checklist</b><br>Planned \u00b7 Brand account</button></div><div><h4>Thu 5</h4><span class=\"muted\">No post planned</span></div><div><h4>Fri 6</h4><button class=\"calendar-post\" data-modal=\"preview\">10:00 \u00b7 Newsletter<br><b>Weekly brief</b><br>Planned \u00b7 Newsletter</button></div><div><h4>Sat 7</h4><span class=\"muted\">No post planned</span></div><div><h4>Sun 8</h4><span class=\"muted\">No post planned</span></div></div><div class=\"box \"><h3>Ready to schedule \u00b7 1 approved package</h3><div class=\"toolbar\"><div><strong>Routine fallback checklist \u00b7 LinkedIn</strong><p>Final package approved. Handoff prepared automatically.</p></div><button class=\"primary\" data-modal=\"schedule\">Choose date & time</button></div></div>"}, "ai": {"title": "AI setup & spending", "sub": "Functions are already listed. Connect once, then edit in one place.", "html": "<div class=\"metrics\"><div class=\"box \"><h3>Monthly limit</h3>$5 pilot setting</div><div class=\"box \"><h3>Per-request limit</h3>$0.50 pilot setting</div><div class=\"box \"><h3>Cost confirmations</h3>Founder configures when confirmation is needed</div></div><div class=\"table\"><div class=\"ai-row\"><strong>Ideas</strong><div>Use writing connection<small>Same saved credential, separate function</small></div><button class=\"\" data-modal=\"connection\">Edit connection</button></div><div class=\"ai-row\"><strong>Writing / text</strong><div>Claude \u00b7 connected<small>Model chosen from account access</small></div><button class=\"\" data-modal=\"connection\">Edit connection</button></div><div class=\"ai-row\"><strong>Research</strong><div>Choose provider<small>Source access and citations need validation</small></div><button class=\"\" data-modal=\"connection\">Edit connection</button></div><div class=\"ai-row\"><strong>Independent review</strong><div>Choose reviewer<small>Independent where channel policy requires</small></div><button class=\"\" data-modal=\"connection\">Edit connection</button></div><div class=\"ai-row\"><strong>Images</strong><div>Not connected<small>Choose a qualified image service</small></div><button class=\"\" data-modal=\"connection\">Edit connection</button></div><div class=\"ai-row\"><strong>Video</strong><div>Not connected<small>Choose a qualified video/render service</small></div><button class=\"\" data-modal=\"connection\">Edit connection</button></div><div class=\"ai-row\"><strong>Audio</strong><div>Not connected<small>Choose a qualified voice/music service</small></div><button class=\"\" data-modal=\"connection\">Edit connection</button></div></div><details class=\"box\"><summary>Advanced controls: caps, credential reuse, fallback and model validation</summary><p>Credentials can be shared by reference across functions, or kept separate. No silent provider fallback. Model availability is checked using the founder\u2019s account; capabilities and pricing are validated separately.</p></details><p class=\"muted\">Claude, OpenAI and Gemini choices apply to supported writing/research/review functions. Image, video and audio require compatible services/adapters. Those integrations remain pending.</p>"}, "activity": {"title": "Activity \u00b7 advanced view", "sub": "Troubleshooting and cost history\u2014not a task the founder must manage.", "html": "<div class=\"box \"><h3>In progress \u00b7 always visible</h3><div class=\"toolbar\"><strong>Preparing carousel \u00b7 4 of 6 scenes</strong><span class=\"pill good\">Working</span></div><progress></progress><p>Continue using Studio. A saved result appears in its draft; no manual import step.</p></div><div class=\"toolbar\"><h3>Recent activity \u00b7 latest 10</h3><button class=\"\" data-modal=\"history\">Older activity / archive</button></div><div class=\"table\"><div class=\"activity-row\"><strong>LinkedIn copy</strong><span>Ready in draft</span><span>$0.14 reserved</span><button class=\"\" data-modal=\"job\">Details</button></div><div class=\"activity-row\"><strong>Source check</strong><span>Needs your input</span><span>$0.06 reserved</span><button class=\"\" data-modal=\"job\">Details</button></div><div class=\"activity-row\"><strong>Earlier incomplete result</strong><span>Needs attention \u2014 incomplete</span><span>$0.14 reserved</span><button class=\"\" data-modal=\"job\">Details</button></div><div class=\"activity-row\"><strong>Ideas batch</strong><span>3 ideas ready</span><span>$0.14 reserved</span><button class=\"\" data-modal=\"job\">Details</button></div></div><p class=\"muted\">Recent list capped at 10 completed items. All active or uncertain jobs remain accessible. Older history is paginated in a popup, not deleted. Reservations are not labelled final invoice charges.</p>"}, "workflow": {"title": "Channel setup", "sub": "Configure once per channel. Studio applies it automatically to new work.", "html": "<div class=\"tabs\"><button class=\"selected\" data-tab>LinkedIn</button><button class=\"\" data-tab>Instagram</button><button class=\"\" data-tab>TikTok</button><button class=\"\" data-tab>Facebook</button><button class=\"\" data-tab>YouTube</button><button class=\"\" data-tab>Reddit</button><button class=\"\" data-tab>Notes</button><button class=\"\" data-tab>Newsletter</button><button class=\"\" data-tab>Hub</button></div><div class=\"toolbar\"><div><h3>LinkedIn workflow</h3><p>Active \u00b7 Updated Oct 29, 2026 \u00b7 applies automatically</p></div><button class=\"primary\" data-modal=\"workflow\">Edit channel setup</button></div><div class=\"tabs\"><button class=\"\" data-tab>Brief</button><button class=\"selected\" data-tab>Brand library</button><button class=\"\" data-tab>Rules & guardrails</button><button class=\"\" data-tab>AI routing</button></div><div class=\"split\"><div class=\"box \"><h3>Selected brand references</h3><p>\u2713 Brand voice \u00b7 approved version</p><p>\u2713 Positioning and proof library</p><p>\u2713 LinkedIn playbook</p><button class=\"\" data-modal=\"instructions\">Open reference</button></div><div class=\"box \"><h3>How automation uses this setup</h3><p>Idea selection \u2192 copy agent \u2192 copy approval \u2192 media preparation \u2192 quality checks \u2192 final approval \u2192 scheduling.</p><p>The founder is not asked to reopen this page for every post.</p><details><summary>Revision history</summary><p>Earlier instructions remain attached to their approved packages. Draft edits update in place with a timestamp.</p></details></div></div><div class=\"selected-banner\">Selected: LinkedIn \u2192 Brand library. Selected tabs, sidebar items and layout toggles always show a clear highlight.</div>"}};const modals={"destination": "<h2>Choose destination before approval</h2><label>Platform<select><option>LinkedIn</option><option>Instagram</option><option>Newsletter</option></select></label><label>Account<select><option>RyzaLab company page</option><option>Founder personal profile</option></select></label><p>Destination affects format and voice. Changing it refreshes the preview and relevant checks before approval.</p><button class=\"primary\" data-close>Use destination</button>", "idea": "<h2>A handoff someone else can follow</h2><p>LinkedIn \u00b7 Created Oct 29 \u00b7 Ready to choose \u00b7 Not published</p><h3>Idea brief</h3><p>A practical post about recording access, responsibilities and fallback steps before someone else runs a household routine.</p><h3>References</h3><p>Reviewed brand library and handoff playbook. No current-web access is implied.</p><h3>Linked content</h3><p>No draft yet. Choosing this idea creates and opens its linked draft automatically.</p><button class=\"primary\" data-go=\"create\">Use idea & create draft</button>", "ideaGenerate": "<h2>Generate ideas</h2><p>Channel: LinkedIn \u00b7 Uses saved instructions and provider.</p><label>Topic<input value=\"Family routines and household handoffs\"></label><p>Generation runs within founder-approved caps. A confirmation appears only if the selected spending policy requires it.</p><button class=\"primary\" data-go=\"ideas\">Generate ideas</button>", "feedback": "<h2>Ask for a targeted change</h2><textarea rows=\"5\" placeholder=\"Shorten the opening, keep the checklist, and make the closing question clearer.\"></textarea><p>Only selected content changes. Unchanged visuals and approved copy are not silently regenerated.</p><button class=\"primary\" data-close>Send feedback</button>", "package": "<h2>Final package review \u00b7 human review 2</h2><div class=\"tabs\"><button class=\"selected\" data-tab>Copy</button><button class=\"\" data-tab>Images</button><button class=\"\" data-tab>Carousel</button><button class=\"\" data-tab>Video</button></div><p class=\"post-copy\">A useful home handoff should answer two questions: who can do what, and what happens when something stops working?<br><br>Write down who needs access, where the instructions are stored, what works manually, and who to contact.<br><br>Walk through the routine with the person who will use it. Their questions reveal what you may have taken for granted.</p><details><summary>Agent findings and version details</summary><p>Review the real evidence, exact asset versions and unresolved blockers before approval.</p></details><button class=\"primary\" data-modal=\"schedule\">Approve package & choose date</button>", "schedule": "<h2>Plan this approved package</h2><p>Exact package approved for the destination below. Choosing a date does not change its content.</p><div class=\"form-grid\"><label>Approved platform<input value=\"LinkedIn\" readonly></label><label>Approved account<input value=\"RyzaLab company page\" readonly></label><label>Date<input type=\"date\" value=\"2026-11-02\"></label><label>Time<input type=\"time\" value=\"09:30\"></label></div><p>Timezone: America/New_York</p><p>Studio prepares handoff and creates the calendar item automatically. Changing platform/account requires a revised preview and approval. A human still publishes on the platform.</p><button class=\"primary\" data-go=\"calendar\">Save to calendar</button> <button class=\"\" data-go=\"calendar\">Schedule later</button>", "preview": "<h2>Monday Nov 2 \u00b7 09:30</h2><p>LinkedIn \u00b7 RyzaLab company page \u00b7 Planned, not published</p><span class=\"pill good\">Read-only approved package</span><div class=\"tabs\"><button class=\"selected\" data-tab>Post preview</button><button class=\"\" data-tab>Text</button><button class=\"\" data-tab>Images / slides</button><button class=\"\" data-tab>Video</button></div><div class=\"social-preview\"><strong>RyzaLab</strong><p>A useful home handoff should answer two questions: who can do what, and what happens when something stops working?<br><br>Write down who needs access, where the instructions are stored, what works manually, and who to contact.<br><br>Walk through the routine with the person who will use it. Their questions reveal what you may have taken for granted.</p></div><p>All visible assets belong to the selected approved version.</p><button class=\"\" data-go=\"create\">Open draft to edit</button> <button class=\"\" data-modal=\"schedule\">Change planned date</button><p class=\"muted\">Edits create a working revision and require renewed approval. The scheduled snapshot is replaced only through an explicit action.</p>", "connection": "<h2>Edit writing connection</h2><label>Provider<select><option>Anthropic \u00b7 Claude</option><option>OpenAI</option><option>Google \u00b7 Gemini</option></select></label><label>API credential<input type=\"password\" value=\"design-only\" disabled></label><small>Wireframe only: credentials cannot be entered or saved here.</small><label>Model<select><option>Choose from models available to your account</option><option>Accessible model for selected provider \u00b7 illustrative</option></select></label><details><summary>Advanced: manual model ID / credential reuse</summary><p>If model listing fails, explain the failure. Manual IDs still require validation. Reuse an existing saved credential or add a separate one.</p></details><p>After connecting, validate access, function capability and pricing. Do not infer video or image support from a text model.</p><button class=\"primary\" data-close>Save connection \u00b7 design only</button>", "history": "<h2>Older activity</h2><div class=\"toolbar\"><input placeholder=\"Search title, date or status\"><select><option>All functions</option><option>Text</option><option>Images</option></select></div><div class=\"activity-row\"><strong>Earlier request 1</strong><span>Completed</span><button class=\"\" data-modal=\"job\">View result</button></div><div class=\"activity-row\"><strong>Earlier request 2</strong><span>Completed</span><button class=\"\" data-modal=\"job\">View result</button></div><div class=\"activity-row\"><strong>Earlier request 3</strong><span>Completed</span><button class=\"\" data-modal=\"job\">View result</button></div><div class=\"activity-row\"><strong>Earlier request 4</strong><span>Completed</span><button class=\"\" data-modal=\"job\">View result</button></div><div class=\"activity-row\"><strong>Earlier request 5</strong><span>Completed</span><button class=\"\" data-modal=\"job\">View result</button></div><div class=\"activity-row\"><strong>Earlier request 6</strong><span>Completed</span><button class=\"\" data-modal=\"job\">View result</button></div><div class=\"activity-row\"><strong>Earlier request 7</strong><span>Completed</span><button class=\"\" data-modal=\"job\">View result</button></div><div class=\"activity-row\"><strong>Earlier request 8</strong><span>Completed</span><button class=\"\" data-modal=\"job\">View result</button></div><div class=\"activity-row\"><strong>Earlier request 9</strong><span>Completed</span><button class=\"\" data-modal=\"job\">View result</button></div><div class=\"activity-row\"><strong>Earlier request 10</strong><span>Completed</span><button class=\"\" data-modal=\"job\">View result</button></div><div class=\"toolbar\"><span>1\u201310 of 100 \u00b7 preserved records</span><button class=\"\" >Next page</button></div>", "job": "<h2>Request details</h2><p>Shows actual state, model, timestamps, reserved cost, result and any error.</p><p>Incomplete output is labelled Needs attention. Provider completion alone is not finished content.</p><button class=\"\" data-go=\"create\">Open linked draft</button>", "instructions": "<h2>Brand reference reader</h2><p>Full reference text is readable in a wide popup. Long content scrolls here rather than stretching the page.</p><p>Sources are treated as evidence, not instructions to override protected founder policy.</p>", "workflow": "<h2>Edit LinkedIn setup</h2><div class=\"tabs\"><button class=\"selected\" data-tab>Brief</button><button class=\"\" data-tab>Brand</button><button class=\"\" data-tab>Rules</button><button class=\"\" data-tab>AI routing</button></div><label>Audience<input value=\"Family caregivers and household decision-makers\"></label><label>Creative instructions<textarea rows=\"5\">Use the approved brand voice and evidence. Draft one selected piece, not an unsolicited weekly pack. Return the requested output format and flag missing facts.</textarea></label><p>Save updates the existing draft. Changes to active policy remain pending review; older approvals keep their original snapshots.</p><button class=\"primary\" data-close>Save changes</button>"};function show(key){document.getElementById('modal').close();const v=views[key]||views.home;document.getElementById('screen').innerHTML='<h1>'+v.title+'</h1><p class="sub">'+v.sub+'</p>'+v.html+'<p class="screen-note">PROPOSED EXPERIENCE · No application changes have been implemented. Example statuses, costs and previews are illustrative.</p>';document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('selected',b.dataset.go===key));window.currentView=key;location.hash=key;window.scrollTo(0,0)}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){show(b.dataset.go);return}if(b.hasAttribute('data-close')){document.getElementById('modal').close();return}if(b.dataset.modal){const d=document.getElementById('modal');document.getElementById('modal-body').innerHTML=modals[b.dataset.modal]||'';if(!d.open)d.showModal();return}if(b.hasAttribute('data-tab')){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');return}if(b.dataset.ideaLayout){document.getElementById('idea-list').hidden=b.dataset.ideaLayout!=='list';document.getElementById('idea-tiles').hidden=b.dataset.ideaLayout!=='tiles';document.querySelectorAll('[data-idea-layout]').forEach(x=>x.classList.toggle('selected',x===b))}});show(location.hash.slice(1)||'home');</script></body></html>
