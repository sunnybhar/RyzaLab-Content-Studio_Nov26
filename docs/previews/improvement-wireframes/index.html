<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={screen:'home',kind:'post',entry:'pipeline',brief:'offline',importStep:1,imported:false,view:'board',ideaStage:{a:'new',b:'shortlisted',c:'ready'},selectedSources:['post','idea'],formValues:{},addedText:'',files:{},researchTier:'sector',humanizer:false,template:'RyzaLab Weekly Brief — example',provider:'openai',imageReady:false,images:{post:false,newsletter:false},imageTarget:'hero',includeImages:true,mode:'schedule',scheduleDate:'2026-11-10',scheduleTime:'12:15',timezone:'America/New_York',destination:'LinkedIn · RyzaLab Company Page',approved:false,version:1,approvedVersion:null,status:'scheduled',connected:false,postText:'Before choosing a connected device, ask what happens when the internet is unavailable.\n\nStart with three questions:\n\n1. Which everyday controls work locally?\n2. Which features require a cloud account or service?\n3. What is the fallback when either is unavailable?\n\nThe answers depend on the specific device and setup. Check the documentation and test the routines that matter to your household.\n\nWhat would you want to keep working first?',newsletterText:'A practical briefing on connected homes, construction decisions and everyday reliability. This sample demonstrates the proposed structure; it is not a researched or generated article.'};
const briefs=[{id:'offline',code:'PIPE-001',title:'What still works when the internet goes down?',angle:'Explain local control, cloud dependencies and useful fallback questions.',channel:'LinkedIn',date:'Nov 10 · 12:15 PM ET'},{id:'buildings',code:'PIPE-002',title:'Connected buildings: decisions to make before installation',angle:'Connect construction planning, device ownership and maintenance expectations.',channel:'Newsletter',date:'Nov 13 · 3:00 PM ET'},{id:'care',code:'PIPE-003',title:'A practical smart-home checklist for family care',angle:'Separate everyday convenience from claims that need stronger evidence.',channel:'LinkedIn',date:'Unscheduled'}];
const sources=[{id:'post',type:'Existing post',title:'Local control: a homeowner’s starting questions',detail:'Saved post version · sample content'},{id:'idea',type:'Generated idea',title:'Building controls belong in the early project brief',detail:'Example idea · original request retained'},{id:'pipeline',type:'Existing Pipeline',title:'A practical smart-home checklist for family care',detail:'PIPE-003 · unscheduled'},{id:'pdf',type:'PDF source',title:'Construction project notes.pdf',detail:'Sample document · not uploaded or parsed'}];
const ideas=[{id:'a',title:'Your home has two different outage risks',text:'Distinguish internet availability from a provider’s service availability.'},{id:'b',title:'Five questions before connecting a new device',text:'Turn ownership and cloud dependencies into a practical checklist.'},{id:'c',title:'A useful handoff explains what happens next',text:'Cover documentation, recovery paths and who owns each account.'}];
const screens=[['home','Home','Choose a journey'],['calendar','Calendar','Planned briefs and approved schedules'],['import','Import · choose file','File selection, without real upload'],['mapping','Import · map columns','Excel headers and ET timezone'],['import-review','Import · review','Dates, duplicates and destinations'],['ideas','Ideas','Existing Pipeline, inbox + Board/Table'],['idea-new','Capture or generate an idea','Pipeline / AI / manual'],['research','Research results','Sector-first sources and coverage'],['create','Create','Choose channel and starting point'],['post','LinkedIn editor','Write, images and Agent Rules'],['newsletter-sources','Newsletter source basket','Old posts, ideas, text and documents'],['outline','Optional combined outline','Arrange sections without another approval gate'],['newsletter','Newsletter editor','Structured article and exports'],['images','Image generation','Provider, brief, placement and preview'],['rules','Agent Rules','Instructions, knowledge and voice'],['research-rules','Research rules','Primary sectors then wider discovery'],['humanizer','Ryan’s Humanizer','Separate writing guidance'],['template','Newsletter template','Content structure and visual layout'],['connections','Provider connections','Secure key entry planned'],['linkedin','LinkedIn connection','OAuth setup and supported capabilities'],['review','Review & publishing','One final package decision'],['scheduled','Publishing status','Scheduled / failed / uncertain examples']];
const titleMap=Object.fromEntries(screens.map(s=>[s[0],s[1]]));
function btn(text,action,primary=false,extra=''){return '<button class="btn'+(primary?' primary':'')+'" '+(action.startsWith('go:')?'data-go="'+action.slice(3)+'"':'data-action="'+action+'"')+' '+extra+'>'+text+'</button>'}
function head(title,description,actions=''){return '<div class="page-head"><div><p class="eyebrow">'+esc(titleMap[state.screen]||'Workflow preview')+'</p><h1>'+esc(title)+'</h1><p>'+esc(description)+'</p></div><div class="actions">'+actions+'</div></div>'}
function callout(text,warn=false){return '<div class="callout'+(warn?' warn':'')+'">'+text+'</div>'}
function fileButton(label,key,accept='.xlsx,.csv,.md,.txt,.pdf,.docx'){return '<label class="btn file-label">'+label+'<input class="file-input" type="file" accept="'+accept+'" data-file="'+key+'"></label>'}
function currentBrief(){return briefs.find(b=>b.id===state.brief)||briefs[0]}
function pipeline(){const b=currentBrief();return '<section class="pipeline"><h2>Existing Pipeline</h2><p>Use an imported brief, generate with AI, or start manually.</p><div class="row"><select class="field" data-field="brief" aria-label="Existing Pipeline brief">'+briefs.map(x=>'<option value="'+x.id+'" '+(x.id===state.brief?'selected':'')+'>'+x.code+' · '+x.title+' · '+x.date+'</option>').join('')+'</select>'+btn('Generate ideas','pipeline-ideas')+btn('Write directly','pipeline-write',true)+'</div><p style="margin:10px 0 0">'+esc(b.angle)+'</p></section>'}
function tabs(items,selected,attr='data-go'){return '<div class="tabs">'+items.map(([id,label])=>'<button '+attr+'="'+id+'" aria-pressed="'+(id===selected)+'">'+label+'</button>').join('')+'</div>'}
function home(){return head('Your content, from brief to publication.','Choose a journey to test how the planned experience fits together.',btn('See every screen','go:map'))+'<div class="journey">'+[['01','Import a content calendar','Bring in dates, titles and angles. Review them before they appear in Calendar and Existing Pipeline.','import'],['02','Start from your pipeline','Select one brief, generate several ideas or write directly in LinkedIn or Newsletter.','create'],['03','Build a combined newsletter','Choose old posts, ideas and uploaded material; apply your structure and image layout.','newsletter-sources'],['04','Set the agent’s direction','Separate channel rules, research preferences, Ryan’s Humanizer and newsletter templates.','rules'],['05','Add images to a draft','Choose a provider, describe the image and place it only after previewing it.','images'],['06','Approve a scheduled release','Review the exact content, account and time. Publishing requires your approval.','review']].map(x=>'<button data-go="'+x[3]+'"><small>JOURNEY '+x[0]+'</small><strong>'+x[1]+'</strong><p>'+x[2]+'</p><span class="flow-link">Explore flow →</span></button>').join('')+'</div>'+callout('Everything here is a proposed interaction using sample data. Files are not uploaded, content is not generated, and no platform receives a post.')}

></div></aside></div>'}

function humanizer(){return head('Ryan’s Humanizer stays a separate instruction.','Upload the actual file or supplied guidance. This preview does not fetch it or substitute a public prompt.',btn('Back to Agent Rules','go:rules'))+'<div class="grid wide-narrow"><div class="panel"><h2>Humanizer guidance</h2><div class="dropzone"><strong>'+esc(state.files.humanizer||'Ryan’s file has not been supplied')+'</strong><p>Markdown, text or a supported document.</p>'+fileButton('Choose Humanizer file','humanizer','.md,.txt,.docx,.pdf')+'</div><label class="label">Preview / editable text</label><textarea class="field" placeholder="Extracted Humanizer guidance appears here in the final build. This prototype does not read the chosen file."></textarea><label class="label">Apply to</label><label class="toggle"><span>LinkedIn writing</span><input type="checkbox" checked></label><label class="toggle"><span>Newsletter writing</span><input type="checkbox" checked></label><div class="sticky-actions">'+btn('Preview original-file download','file-preview')+btn('Save preview guidance','save-settings',true)+'</div></div><aside class="panel"><h3>What the agent receives</h3><p>Channel Instructions + relevant knowledge + selected voice examples + Humanizer + the current task/output structure.</p>'+callout('The writing request records the versions actually used. Later uploads do not change an already-saved request.')+'<p>Humanizer changes writing style; it does not authorize invented facts, sources or personal experiences.</p></aside></div>'}
function template(){return head('Your newsletter, in your own structure.','Content order and visual export layout are configured separately, then used together.',btn('Back to Agent Rules','go:rules'))+'<div class="grid cols2"><div class="panel"><h2>Content structure</h2>'+fileButton('Choose structure / example','newsletter-template','.md,.txt,.docx,.pdf')+'<label class="label">Template name</label><input class="field" data-field="template" value="'+esc(state.template)+'"><label class="label">Sections and image slots</label><textarea class="field" style="min-height:245px">Title + preview text\nOptional hero image\nOpening / background\nMain story: evidence and reasoning\nIndustry roundup: several related items\nOptional inline image / diagram\nPractical takeaway / checklist\nLimitations and missing confirmations\nSources\nClosing question / approved CTA</textarea><p class="small">PDF examples can guide the design; exact format extraction must be reviewed.</p></div><div class="panel"><h2>Visual layout & export</h2>'+fileButton('Choose DOCX / visual reference','newsletter-layout','.docx,.pdf')+'<div class="grid cols2"><label><span class="label">Page layout</span><select class="field"><option>A4 / Letter article</option><option>Email-friendly layout</option></select></label><label><span class="label">Body typography</span><select class="field"><option>Readable editorial sans serif</option><option>Editorial serif</option></select></label></div><label class="label">Length guidance</label><input class="field" value="1,200–1,600 substantive words · target at least 2–3 pages"><div class="empty-slot" style="margin-top:16px;min-height:180px"><strong>Visual document preview</strong><span>Header · title · sections · image slots · sources · footer</span><span>Actual pagination shown during export preview.</span></div><div class="sticky-actions">'+btn('Preview newsletter layout','go:newsletter')+btn('Save sample template','save-settings',true)+'</div></div></div>'}
function connections(){return head('Connect capabilities, not just API keys.','Writing, images and publishing use separate qualified connections. No credentials can be entered in this prototype.')+'<div class="grid cols3"><div class="panel"><span class="tag gray">Writing</span><h2 style="margin-top:13px">Claude</h2><p>Existing writing connection, rate qualification and bounded post allowance remain part of Studio.</p>'+btn('Preview connection details','connection-info')+'</div><div class="panel"><span class="tag gray">Images</span><h2 style="margin-top:13px">OpenAI</h2><p>Choose the supported image model and verify capability and pricing before a paid image request.</p><input class="field" type="password" disabled placeholder="Secure key entry in the live build">'+btn('Preview setup','connection-info')+'</div><div class="panel"><span class="tag gray">Images</span><h2 style="margin-top:13px">Google / Nano Banana</h2><p>Confirm the exact available Gemini image model, API access and qualified cost.</p><input class="field" type="password" disabled placeholder="Secure key entry in the live build">'+btn('Preview setup','connection-info')+'</div></div><div class="panel"><div class="row"><div><h2>LinkedIn publishing connection</h2><p>OAuth, exact account/Page permissions and draft/publishing capability must be verified.</p></div>'+btn('View LinkedIn setup','go:linkedin',true)+'</div></div>'+callout('A newsletter may publish through LinkedIn, an email platform or a website. Its actual destination and supported API need to be selected before publishing is enabled.',true)}
function linkedin(){return head('Connect LinkedIn with the right permissions.','Member posts, company-Page posts and native draft support are separate capabilities to verify.',btn('Back to connections','go:connections'))+'<div class="grid wide-narrow"><div class="panel"><h2>Connection setup</h2><div class="timeline"><div><strong>1 · Developer application</strong><p>Create/configure the app and associate the Page where required.</p></div><div><strong>2 · Product and permission access</strong><p>Request actual access for the intended member/Page operation. Approval is not assumed.</p></div><div><strong>3 · OAuth redirect and account authorization</strong><p>The live experience redirects to LinkedIn sign-in. This wireframe opens no authorization flow.</p></div><div><strong>4 · Verify account roles and capabilities</strong><p>Check the exact destination, token lifecycle and allowed operations before enabling publication.</p></div></div>'+btn('Preview OAuth connection','preview-oauth',true)+'</div><aside><div class="panel"><h3>Capabilities to verify</h3><div class="toggle"><span>Company Page posting</span><span class="tag gray">Not verified</span></div><div class="toggle"><span>Personal profile posting</span><span class="tag gray">Not verified</span></div><div class="toggle"><span>Native unpublished draft</span><span class="tag warn">Do not assume</span></div><div class="toggle"><span>LinkedIn Newsletter</span><span class="tag warn">Separate check</span></div></div><div class="panel"><h3>Prepare without submitting</h3><p>If native drafts are unsupported, retain the draft in Studio and offer copy/download/open-LinkedIn handoff.</p>'+btn('Preview prepare-only handoff','prepare-only')+'</div></aside></div>'}
function review(){return head('Review once. Approve the exact release.','Routine checks run in the background. Your final decision covers text, media, destination and the selected time.',btn('Edit content',state.kind==='newsletter'?'go:newsletter':'go:post'))+'<div class="status-bar"><strong>Example state: automatic checks ready</strong><span>Real reports and findings will appear here.</span></div><div class="grid wide-narrow"><div class="panel"><div class="row"><span class="tag">'+(state.kind==='newsletter'?'Newsletter':'LinkedIn text post')+'</span><span class="small">Draft version '+state.version+'</span></div><h2 style="margin-top:15px">'+(state.kind==='newsletter'?'Connected homes: a practical briefing':esc(currentBrief().title))+'</h2><p style="white-space:pre-wrap">'+esc(state.kind==='newsletter'?state.newsletterText:state.postText)+'</p>'+(state.images[state.kind]&&state.includeImages?'<div class="placeholder"><span>Selected sample image · included in this package</span></div>':'')+'<details style="margin-top:15px"><summary>Sources and automated check findings</summary><p>Show the actual cited evidence, current report and missing inputs. Sample readiness is not a completed agent review.</p></details><details><summary>Override editorial checks if needed</summary><p>Retain the real findings and record a reason; do not manufacture a passed report.</p><textarea class="field" placeholder="Reason for proceeding despite an editorial finding"></textarea></details></div><aside class="panel"><h3>Publishing destination</h3><label class="label">Mode</label><select class="field" data-field="mode"><option value="schedule" '+(state.mode==='schedule'?'selected':'')+'>Schedule publishing after my approval</option><option value="prepare" '+(state.mode==='prepare'?'selected':'')+'>Prepare only · do not submit</option></select><label class="label">Platform / exact account</label><select class="field" data-field="destination"><option>LinkedIn · RyzaLab Company Page</option><option>LinkedIn · personal profile</option><option>Instagram · account access to verify</option><option>YouTube · account access to verify</option><option>Reddit · account access to verify</option><option>Newsletter · destination to choose</option></select><p class="small">Platform/account capabilities must be verified in the live connection.</p><div class="grid cols2"><label><span class="label">Date</span><input class="field" type="date" data-field="scheduleDate" value="'+state.scheduleDate+'"></label><label><span class="label">Time</span><input class="field" type="time" data-field="scheduleTime" value="'+state.scheduleTime+'"></label></div><label class="label">Timezone</label><select class="field" data-field="timezone"><option>America/New_York</option><option>America/Chicago</option><option>UTC</option></select>'+callout('Approve version '+state.version+' for '+esc(state.destination)+' at '+state.scheduleDate+' '+state.scheduleTime+' '+state.timezone+'. Changing content, destination or time requires new approval.')+'<button class="btn primary" style="width:100%" data-action="approve">'+(state.mode==='prepare'?'Approve & prepare only':'Approve & schedule')+'</button><p class="small">Prototype approval updates this screen only. Real publication requires a supported, authorized platform connection.</p></aside></div>'}
function scheduled(){const paused=state.approved&&state.approvedVersion!==state.version;return head(!state.approved?'Awaiting your publishing approval.':paused?'Changes need your approval again.':state.mode==='prepare'?'Approved for a manual handoff.':'Your approved publishing package.','Illustrative status only. No post has been sent to a platform.',btn('Calendar','go:calendar')+btn('Back to editor',state.kind==='newsletter'?'go:newsletter':'go:post'))+'<div class="grid wide-narrow"><div class="panel"><div class="row"><h2>'+esc(currentBrief().title)+'</h2><span class="tag '+(paused?'warn':'')+'">'+(!state.approved?'Awaiting approval':paused?'Approval paused':state.mode==='prepare'?'Prepare only':state.status==='unknown'?'Example: outcome uncertain':state.status==='failed'?'Example: failed':'Example: scheduled')+'</span></div><div class="timeline"><div><strong>Content package prepared</strong><p>Version '+(state.approvedVersion||state.version)+' · text, sources and chosen media.</p></div><div><strong>'+ (state.approved?'User decision recorded in this preview':'Not approved yet') +'</strong><p>'+esc(state.destination)+' · '+state.scheduleDate+' '+state.scheduleTime+' '+state.timezone+'.</p></div><div><strong>'+(!state.approved?'Open review to approve this package':paused?'Waiting for reapproval':state.mode==='prepare'?'Ready to copy / download':state.status==='unknown'?'Check the platform outcome before repeating':state.status==='failed'?'Resolve the shown publishing error':'Waiting for the approved publishing time')+'</strong><p>'+(state.status==='unknown'?'An interruption is not proof of failure. The real system must check the platform result before retrying.':'The actual platform ID, live URL and completion time appear only after a confirmed real result.')+'</p></div></div><div class="actions">'+(state.mode==='prepare'?btn('Copy / download handoff preview','handoff'):btn('Change / reapprove schedule','go:review'))+btn('Cancel sample schedule','cancel-schedule')+'</div>'+callout('Preparing a post is not the same as publishing it. This wireframe cannot create a native LinkedIn draft or a live post.',true)+'</div><aside class="panel"><h3>Explore other outcome states</h3><p>These controls are for design review only, not part of the normal user workflow.</p><div class="stack">'+btn('Example: scheduled','status:scheduled')+btn('Example: publishing failed','status:failed')+btn('Example: uncertain API outcome','status:unknown')+btn('Edit content after approval','change-after-approval')+'</div></aside></div>'}
const renderers={home,map,calendar,import:importScreen,mapping,'import-review':importReview,ideas:ideasScreen,'idea-new':ideaNew,research,create,post,'newsletter-sources':sourceBasket,outline,newsletter,images:imageScreen,rules,'research-rules':researchRules,humanizer,template,connections,linkedin,review,scheduled};
function go(screen){state.screen=renderers[screen]?screen:'home';history.replaceState(null,'','#'+state.screen);render();window.scrollTo(0,0);document.getElementById('sidebar').classList.remove('open')}
function render(){document.getElementById('main').innerHTML=renderers[state.screen]();document.getElementById('screenLabel').textContent=titleMap[state.screen]+' · proposed';document.getElementById('nav').innerHTML=[['home','⌂','Home'],['ideas','◇','Ideas'],['create','✎','Create'],['calendar','▦','Calendar'],['review','✓','Reviews'],['newsletter-sources','▤','Content library']].map(x=>'<button data-go="'+x[0]+'" class="'+(x[0]===state.screen?'active':'')+'"><span class="nav-icon">'+x[1]+'</span>'+x[2]+'</button>').join('');document.querySelectorAll('[data-field]').forEach(input=>{const key=input.dataset.field;if(input.type!=='checkbox'&&key in state)input.value=state[key]});document.querySelectorAll('#main input,#main textarea,#main select').forEach((el,index)=>{if(el.dataset.field||el.dataset.source||el.type==='file')return;const key=state.screen+':'+index;el.dataset.formKey=key;if(key in state.formValues){if(el.type==='checkbox')el.checked=state.formValues[key];else el.value=state.formValues[key]}})}
let toastTimer;function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
function modal(title,body){document.getElementById('modalBody').innerHTML='<h2>'+title+'</h2>'+body;document.getElementById('modal').showModal()}
function action(a){if(a==='close'){document.getElementById('modal').close();return}if(a==='mobile'){document.getElementById('sidebar').classList.toggle('open');return}if(a==='sample-workbook'){state.files.calendar='RyzaLab Content Calendar v2.2.xlsx · sample mapping only';go('mapping');return}if(a==='template-columns'){modal('Planned calendar template','<p>Date · Time · Timezone · Channel · Account · Working title · Angle/brief · Audience · Format · Source links · Owner · Notes · Stable Brief ID</p><p>The final XLSX template will be based on your workbook. No spreadsheet is created or imported by this wireframe.</p>');return}if(a==='confirm-import'){state.imported=true;go('calendar');toast('Sample import complete: 3 briefs, 2 planned dates. No real records imported.');return}if(a.startsWith('select-')){state.brief=a.slice(7);go('create');return}if(a==='pipeline-ideas'){state.entry='pipeline';go('idea-new');return}if(a==='pipeline-write'||a==='open-editor'||a==='write-from-research'){go(state.kind==='newsletter'?'newsletter-sources':'post');return}if(a==='new-ai'||a==='create-ai'){state.entry='ai';go('idea-new');return}if(a==='new-manual'){state.entry='manual';go('idea-new');return}if(a==='save-manual'){go('ideas');toast('Sample idea saved in this browser preview only.');return}if(a.startsWith('stage:')){const [,id,stage]=a.split(':');state.ideaStage[id]=stage;render();return}if(a.startsWith('idea-detail:')){const idea=ideas.find(x=>x.id===a.split(':')[1]);modal(esc(idea.title),'<p>'+esc(idea.text)+'</p><p><strong>Source context:</strong> the actual links, excerpts and original request will appear here in the built feature.</p>'+btn('Write from this idea','idea-write:'+idea.id,true));return}if(a.startsWith('idea-write:')){document.getElementById('modal').close();go(state.kind==='newsletter'?'newsletter-sources':'post');return}if(a==='rules-used'){modal('Guidance for this writing request','<p>Channel Instructions / skills<br>Context / knowledge<br>Selected original voice examples<br>Ryan’s Humanizer (when supplied)<br>Research profile and selected sources<br>Newsletter structure/layout (for newsletters)</p><p>In the real workflow, this shows the exact saved versions included. These are illustrative slots, not uploaded or connected files.</p>');return}if(a==='save-draft'){toast('Sample changes retained in this prototype session.');return}if(a==='add-text'){modal('Add your own material','<label class="label">Title</label><input class="field" id="pastedTitle" placeholder="A working title"><label class="label">Text</label><textarea class="field" id="pastedText" placeholder="Paste source material or your own idea…"></textarea><div class="sticky-actions">'+btn('Add to sample basket','save-text',true)+'</div>');return}if(a==='save-text'){state.addedText=document.getElementById('pastedText').value;document.getElementById('modal').close();render();toast('Text retained locally for this preview only.');return}if(a==='newsletter-write'){state.kind='newsletter';go('newsletter');return}if(a==='image-post'||a==='image-newsletter'){state.kind=a==='image-post'?'post':'newsletter';go('images');return}if(a==='sample-image'){state.imageReady=true;render();toast('Example image-result state shown. No image was generated.');return}if(a==='attach-image'){state.images[state.kind]=true;state.version++;state.approved=false;go(state.kind==='newsletter'?'newsletter':'post');toast('Sample image placeholder attached.');return}if(a==='save-settings'){toast('Preview setting saved in memory only.');return}if(a==='connection-info'){modal('Secure connection setup','<p>The live build will accept the key securely, verify provider/model capability, and qualify its estimated cost.</p><p>No API key can be entered here. This prototype makes no provider calls.</p>');return}if(a==='preview-oauth'){modal('LinkedIn authorization preview','<p>The live build will redirect you to LinkedIn, request the supported permissions and verify the exact account/Page role.</p><p>No LinkedIn account has been connected. Native draft and newsletter capabilities remain unverified.</p>');return}if(a==='prepare-only'){state.mode='prepare';go('review');return}if(a==='approve'){state.approved=true;state.approvedVersion=state.version;go('scheduled');return}if(a.startsWith('status:')){state.status=a.split(':')[1];go('scheduled');return}if(a==='change-after-approval'){state.version++;go('scheduled');return}if(a==='cancel-schedule'){state.approved=false;go('calendar');toast('Sample schedule cancelled. No real schedule existed.');return}if(a==='handoff'){modal('Prepare-only handoff','<p>The approved text and optional media stay in Studio. Copy/download them and open the platform when you are ready.</p><p>If verified API access supports native drafts, that capability can be offered separately. Saving a draft must never silently publish it.</p>');return}if(a==='export-pdf'||a==='export-docx'){modal('Document export preview','<p>The final feature downloads the current newsletter in the selected structure and layout, with your chosen image inclusion.</p><p>This wireframe does not export a real newsletter. The separate wireframe PDF deck is for reviewing these screens.</p>');return}if(a==='file-preview'){modal('File management preview','<p>The real feature will preserve the original for download and expose the editable extracted instructions/context separately.</p><p>No selected file is read or uploaded by this prototype.</p>');return}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-go],[data-action],[data-entry],[data-kind],[data-view],[data-brief],[data-remove-source]');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.action){action(b.dataset.action);return}if(b.dataset.entry){state.entry=b.dataset.entry;render();return}if(b.dataset.kind){state.kind=b.dataset.kind;render();return}if(b.dataset.view){state.view=b.dataset.view;render();return}if(b.dataset.brief){state.brief=b.dataset.brief;render();return}if(b.dataset.removeSource){state.selectedSources=state.selectedSources.filter(x=>x!==b.dataset.removeSource);render()}});
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.formKey)state.formValues[el.dataset.formKey]=el.type==='checkbox'?el.checked:el.value;if(!el.dataset.field)return;const key=el.dataset.field,prior=state[key];state[key]=el.type==='checkbox'?el.checked:el.value;if(['postText','newsletterText','scheduleDate','scheduleTime','destination','timezone','mode'].includes(key)&&prior!==state[key]&&state.approved){state.version++;toast('Package changed. The planned release needs your approval again.')}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.file){state.files[el.dataset.file]=el.files?.[0]?.name||'';render();toast('Filename selected locally only. No upload or parsing occurred.');return}if(el.dataset.source){state.selectedSources=el.checked?[...new Set([...state.selectedSources,el.dataset.source])]:state.selectedSources.filter(x=>x!==el.dataset.source);render();return}if(el.dataset.field&&['kind','brief','provider','imageTarget','includeImages','mode','destination','timezone'].includes(el.dataset.field))render()});
window.prototype={state,go,screens};if(location.hash&&renderers[location.hash.slice(1)])state.screen=location.hash.slice(1);render();
</script></body></html>
